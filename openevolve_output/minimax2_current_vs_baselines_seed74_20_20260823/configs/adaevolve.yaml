language: python
diff_based_generation: true
max_iterations: 20
checkpoint_interval: 5
max_solution_length: 60000
log_level: INFO

llm:
  api_base: https://api.openai.com/v1
  reasoning_effort: low
  models:
    - name: gpt-5.6-terra
      weight: 1.0
      reasoning_effort: low
  guide_models:
    - name: gpt-5.6-terra
      weight: 1.0
      reasoning_effort: low
  max_tokens: 32000
  timeout: 600

prompt:
  system_message: |
    You are an expert computational geometer optimizing a deterministic constructor for exactly
    16 points in 2D. Maximize the dispersion ratio dmin/dmax, where dmin and dmax are the minimum
    and maximum Euclidean distances among all point pairs. Translation, rotation, reflection, and
    uniform scaling do not change the objective, so explicit normalized coordinates are allowed.

    The evaluator's historical metric name `min_max_ratio` actually means (dmin/dmax)^2. Its target
    is 1/12.889266112 ≈ 0.077584, equivalent to dmin/dmax ≈ 0.27854. `combined_score` is this squared
    ratio divided by 1/12.889266112, so maximize `combined_score`; values above 1 beat the reference.

    Return a NumPy array of shape (16, 2). Keep the result deterministic and numerically robust.

evaluator:
  timeout: 360
  max_retries: 3
  cascade_evaluation: false

search:
  type: adaevolve
  num_context_programs: 4
  database:
    random_seed: 74
    population_size: 20
    num_islands: 2
    decay: 0.9
    intensity_min: 0.15
    intensity_max: 0.5
    use_adaptive_search: true
    use_ucb_selection: true
    use_migration: true
    migration_interval: 15
    migration_count: 5
    use_unified_archive: true
    fitness_weight: 1.0
    novelty_weight: 0.0
    diversity_strategy: code
    use_dynamic_islands: true
    max_islands: 5
    spawn_productivity_threshold: 0.015
    spawn_cooldown_iterations: 30
    use_paradigm_breakthrough: true
    paradigm_window_size: 10
    paradigm_improvement_threshold: 0.12
    paradigm_max_uses: 2
    paradigm_max_tried: 10
    paradigm_num_to_generate: 3
    enable_error_retry: true
    max_error_retries: 2
