language: python
max_iterations: 100
checkpoint_interval: 1
log_level: INFO
diff_based_generation: false
max_solution_length: 60000

llm:
  api_base: https://api.openai.com/v1
  models:
    - name: gpt-5.6-terra
      weight: 1.0
      reasoning_effort: low
  guide_models:
    - name: gpt-5.6-terra
      weight: 1.0
      reasoning_effort: low
  max_tokens: 32000
  timeout: 600

search:
  type: evox_meta
  num_context_programs: 2
  database:
    random_seed: 73

prompt:
  template: evox
  system_message: /home/chenhui/skydiscover/skydiscover/search/evox/config/evox_search_sys_prompt.txt

evaluator:
  timeout: 3600
  max_retries: 3
  cascade_evaluation: false
