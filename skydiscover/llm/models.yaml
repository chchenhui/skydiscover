# Model reference list
# Use any name below as the value for LLMModelConfig(name=...)
# OpenAI: https://platform.openai.com/docs/models
# Anthropic：https://docs.anthropic.com/en/docs/about-claude/models
# Google：https://ai.google.dev/gemini-api/docs/models
# OpenRouter：https://openrouter.ai/models
# OpenRouter prices below are USD per million tokens, sourced from
# https://openrouter.ai/api/v1/models

openai:
  - name: gpt-5.6-luna
    input_per_million: 0.20
    output_per_million: 1.20
    cache_read_per_million: 0.02
    cache_write_per_million: 0.25

# Claude cache tiers, as multiples of the input price: reads 0.1x, 5m writes
# 1.25x, 1h writes 2x. AnthropicLLM picks the write price matching `cache_ttl`
# (cache_write_per_million for "5m", cache_write_1h_per_million for "1h").
anthropic:
  - name: claude-opus-5
    input_per_million: 5.00
    output_per_million: 25.00
    cache_read_per_million: 0.50
    cache_write_per_million: 6.25
    cache_write_1h_per_million: 10.00
  - name: claude-opus-4-8
    input_per_million: 5.00
    output_per_million: 25.00
    cache_read_per_million: 0.50
    cache_write_per_million: 6.25
    cache_write_1h_per_million: 10.00
  - name: claude-sonnet-5
    input_per_million: 2.00
    output_per_million: 10.00
    cache_read_per_million: 0.20
    cache_write_per_million: 2.50
    cache_write_1h_per_million: 4.00
  - name: claude-sonnet-4-6
    input_per_million: 3.00
    output_per_million: 15.00
    cache_read_per_million: 0.30
    cache_write_per_million: 3.75
    cache_write_1h_per_million: 6.00

